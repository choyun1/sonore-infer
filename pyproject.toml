[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sonore-infer"
dynamic = ["version"]
description = "Inferring auditory scenes by inverting a generative model of sound (analysis by synthesis)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Adrian Cho", email = "choyun1@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",  # sourceroom.Posterior.theta_quantiles (scipy.stats.norm)
    "torch>=2.4",
]

[project.urls]
Source = "https://github.com/choyun1/sonore-infer"

[project.optional-dependencies]
# sonore makes stimuli and serves as the test oracle (design D2); the
# differentiable core never imports it. Pinned so its output cannot change
# under us. 0.6.0 is the first release with gaussian_spectrogram
# (docs/design/source-reverb.md section 7).
stimuli = ["sonore==0.6.0"]
# Scene.model() hands a scene to Pyro (design C7); the core never needs it.
pyro = ["pyro-ppl>=1.9"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.11", "sonore==0.6.0", "pyro-ppl>=1.9"]

[tool.hatch.version]
path = "src/sonore_infer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sonore_infer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.mypy]
# default (non-strict) checking of src/ only; tools/ and tests/ are scripts
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# optional dependencies, untyped or not installed
module = ["sonore.*", "pyro.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Pyro is optional (design C7); its own types would make scene.py's adapter noisy
module = ["pyro.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E741"]
