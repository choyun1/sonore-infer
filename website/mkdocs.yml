# Base configuration of the project website. website/build.py adds the
# folders and the navigation, and builds the site; see website/README.md.
site_name: sonore-infer
site_description: A model of human hearing as inference in a generative model of sound
repo_url: https://github.com/choyun1/sonore-infer
edit_uri: ""
theme:
  name: material
  # system fonts, nothing loaded from Google
  font: false
  # light or dark from the reader's system setting, as the results plots do
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: blue
  features:
    - navigation.sections
    - toc.follow
markdown_extensions:
  - tables
  - fenced_code
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - mdx_truly_sane_lists
extra_css:
  - assets/site.css
extra_javascript:
  - assets/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
