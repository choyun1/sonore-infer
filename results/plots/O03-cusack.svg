<style>
:root { --background: #f6f7f5; --text: #1b1d1c; --muted: #5d625f; --rule: #dcdfdb;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #b07c00; --s5: #6b6f6c;
  --q1: #b9d3f2; --q2: #85b1e8; --q3: #4f8bdc; --q4: #2a69bd; --q5: #163f78; --diamond: #1b1d1c }
